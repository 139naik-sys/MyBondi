<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Spank Meter</title>
<meta name="theme-color" content="#05100c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05100c;
    --bg2:#0a1a14;
    --acid:#a6ff00;
    --acid-dim: rgba(166,255,0,0.32);
    --teal:#00e5cc;
    --teal-dim: rgba(0,229,204,0.30);
    --text:#eafff0;
    --muted:#7fa08f;
    --danger:#ff5d5d;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(circle at 85% 5%, rgba(166,255,0,0.16), transparent 42%),
      radial-gradient(circle at 10% 85%, rgba(0,229,204,0.15), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'Baloo 2', system-ui, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
  }
  .wrap{
    width:100%;
    max-width:480px;
    padding:22px 20px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }
  .title-field{
    width:100%;
    text-align:center;
  }
  .title-input{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:2px dashed rgba(166,255,0,0.25);
    color:var(--acid);
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(20px,6.5vw,28px);
    text-align:center;
    padding:8px 4px 10px;
    text-shadow:0 0 14px var(--acid-dim);
  }
  .title-input::placeholder{ color:rgba(166,255,0,0.45); text-shadow:none; }
  .title-input:focus{ outline:none; border-bottom-color:var(--acid); }

  .heading{
    text-align:center;
  }
  .app-name{
    font-weight:800;
    font-size:14px;
    letter-spacing:1px;
    color:var(--teal);
    text-shadow:0 0 10px var(--teal-dim);
    margin:0;
  }
  .subtitle{
    color:var(--muted);
    font-size:13px;
    margin-top:4px;
    min-height:16px;
  }

  .meter{
    position:relative;
    width:min(70vw,260px);
    height:min(70vw,260px);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle at 50% 40%, var(--bg2) 0%, #030605 75%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04),
      0 0 36px 6px var(--acid-dim),
      0 0 80px 18px var(--teal-dim) inset;
  }
  .meter::before{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:50%;
    border:2px dashed rgba(255,255,255,0.08);
  }
  .count{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:clamp(44px,14vw,60px);
    line-height:1;
    color:var(--acid);
    text-shadow: 0 0 16px var(--acid), 0 0 40px var(--acid-dim);
    transition: transform .12s ease;
  }
  .count.bump{ transform: scale(1.12); }
  .breakdown{
    display:flex;
    gap:14px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .pill{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 15px;
    border-radius:999px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    font-size:14px;
  }
  .pill .dot{
    width:10px;height:10px;border-radius:50%;
    box-shadow:0 0 8px currentColor;
  }
  .pill.special{ color:var(--teal); }
  .pill.special .dot{ background:var(--teal); }
  .pill.normal{ color:var(--acid); }
  .pill.normal .dot{ background:var(--acid); }
  .pill b{ color:var(--text); font-family:'Space Mono',monospace; }

  .progress-track{
    width:min(78vw,300px);
    height:9px;
    border-radius:999px;
    background:rgba(255,255,255,0.06);
    overflow:hidden;
    box-shadow:inset 0 0 6px rgba(0,0,0,0.5);
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--teal), var(--acid));
    box-shadow:0 0 12px var(--acid);
    transition:width .25s ease;
    border-radius:999px;
  }
  .progress-label{
    color:var(--muted);
    font-size:12px;
    text-align:center;
    margin-top:6px;
  }

  .log-form{
    width:100%;
    max-width:420px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:18px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .log-form label{
    font-size:12px;
    color:var(--muted);
    padding-left:2px;
  }
  .log-form input[type="text"], .log-form input[type="number"]{
    width:100%;
    background:rgba(0,0,0,0.35);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:12px;
    color:var(--text);
    font-family:'Baloo 2', sans-serif;
    font-size:15px;
    padding:12px 14px;
  }
  .log-form input:focus{ outline:none; border-color:var(--acid); }
  .field-error{
    color:var(--danger);
    font-size:12px;
    display:none;
    padding-left:2px;
  }
  .field-error.show{ display:block; }
  .row-2{ display:flex; gap:10px; }
  .row-2 > div{ flex:1; }

  button{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    border:none;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-add{
    padding:14px 20px;
    font-size:17px;
    border-radius:14px;
    color:#03150f;
    background:linear-gradient(135deg, var(--acid), var(--teal));
    box-shadow:0 8px 22px var(--acid-dim), 0 0 0 1px rgba(255,255,255,0.15) inset;
    margin-top:4px;
  }
  .btn-add:active{ transform:scale(0.97); }

  .btn-row{
    display:flex;
    gap:12px;
  }
  .btn-small{
    padding:11px 16px;
    font-size:13px;
    border-radius:14px;
    color:var(--text);
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
  }
  .btn-small:active{ transform:scale(0.95); }

  .entries{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .entries-label{
    font-size:12px;
    color:var(--muted);
    padding-left:2px;
  }
  .entry{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:12px;
    padding:10px 12px;
  }
  .entry-info{ min-width:0; }
  .entry-name{
    font-size:14px;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .entry-time{
    font-size:11px;
    color:var(--muted);
  }
  .entry-right{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .entry-count{
    font-family:'Space Mono', monospace;
    color:var(--acid);
    font-size:14px;
  }
  .entry-del{
    background:none;
    border:none;
    color:var(--muted);
    font-size:16px;
    cursor:pointer;
    padding:2px 6px;
  }
  .entry-del:active{ color:var(--danger); }
  .empty-state{
    color:var(--muted);
    font-size:13px;
    text-align:center;
    padding:10px;
  }

  footer{
    color:#3a4a42;
    font-size:11px;
    margin-top:8px;
    padding-top:10px;
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="heading">
    <p class="app-name">SPANK METER</p>
  </div>

  <div class="title-field">
    <input type="text" class="title-input" id="titleInput" placeholder="Name this tracker" maxlength="40">
  </div>

  <div class="meter">
    <div class="count" id="count">0</div>
  </div>

  <div class="breakdown">
    <div class="pill special"><span class="dot"></span>Special <b id="specialCount">0</b></div>
    <div class="pill normal"><span class="dot"></span>Normal <b id="normalCount">0</b></div>
  </div>

  <div style="width:100%; display:flex; flex-direction:column; align-items:center;">
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-label" id="progressLabel">0 / 10 to next special spank</div>
  </div>

  <div class="log-form">
    <div>
      <label for="mistakeName">What'd he do?</label>
      <input type="text" id="mistakeName" placeholder="Left the dishes again" maxlength="60">
      <div class="field-error" id="nameError">Type in what he did.</div>
    </div>
    <div class="row-2">
      <div>
        <label for="mistakeCount">How many spanks?</label>
        <input type="number" id="mistakeCount" min="1" step="1" value="1">
        <div class="field-error" id="countError">Enter at least 1.</div>
      </div>
    </div>
    <button class="btn-add" id="addBtn">Log it</button>
  </div>

  <div class="btn-row">
    <button class="btn-small" id="undoBtn">Undo last</button>
    <button class="btn-small" id="resetBtn">Reset all</button>
  </div>

  <div class="entries">
    <div class="entries-label">Logged mistakes</div>
    <div id="entriesList"></div>
  </div>

  <footer>counts saved on this device only</footer>
</div>

<script>
(function(){
  const STORAGE_KEY = 'spankMeterEntries';
  const TITLE_KEY = 'spankMeterTitle';

  const countEl = document.getElementById('count');
  const specialEl = document.getElementById('specialCount');
  const normalEl = document.getElementById('normalCount');
  const fillEl = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const titleInput = document.getElementById('titleInput');
  const nameInput = document.getElementById('mistakeName');
  const countInput = document.getElementById('mistakeCount');
  const nameError = document.getElementById('nameError');
  const countError = document.getElementById('countError');
  const addBtn = document.getElementById('addBtn');
  const undoBtn = document.getElementById('undoBtn');
  const resetBtn = document.getElementById('resetBtn');
  const entriesList = document.getElementById('entriesList');

  let entries = [];
  try {
    entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    if (!Array.isArray(entries)) entries = [];
  } catch(e){ entries = []; }

  titleInput.value = localStorage.getItem(TITLE_KEY) || '';
  titleInput.addEventListener('input', function(){
    localStorage.setItem(TITLE_KEY, titleInput.value);
  });

  function vibrate(ms){
    if (navigator.vibrate) { try { navigator.vibrate(ms); } catch(e){} }
  }

  function totalCount(){
    return entries.reduce(function(sum, e){ return sum + e.count; }, 0);
  }

  function formatTime(ts){
    const d = new Date(ts);
    return d.toLocaleDateString(undefined, {month:'short', day:'numeric'}) + ' \u00b7 ' + d.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
  }

  function render(bump){
    const total = totalCount();
    const special = Math.floor(total / 10);
    const normal = total % 10;
    countEl.textContent = total;
    specialEl.textContent = special;
    normalEl.textContent = normal;
    fillEl.style.width = (normal * 10) + '%';
    progressLabel.textContent = normal + ' / 10 to next special spank';

    if (bump){
      countEl.classList.remove('bump');
      void countEl.offsetWidth;
      countEl.classList.add('bump');
    }

    entriesList.innerHTML = '';
    if (entries.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'nothing logged yet';
      entriesList.appendChild(empty);
    } else {
      const sorted = entries.slice().reverse();
      sorted.forEach(function(entry){
        const row = document.createElement('div');
        row.className = 'entry';
        row.innerHTML =
          '<div class="entry-info">' +
            '<div class="entry-name"></div>' +
            '<div class="entry-time"></div>' +
          '</div>' +
          '<div class="entry-right">' +
            '<span class="entry-count"></span>' +
            '<button class="entry-del" aria-label="Delete entry">\u2715</button>' +
          '</div>';
        row.querySelector('.entry-name').textContent = entry.name;
        row.querySelector('.entry-time').textContent = formatTime(entry.ts);
        row.querySelector('.entry-count').textContent = '+' + entry.count;
        row.querySelector('.entry-del').addEventListener('click', function(){
          entries = entries.filter(function(e){ return e.id !== entry.id; });
          save();
          render(true);
        });
        entriesList.appendChild(row);
      });
    }
  }

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }

  function clearErrors(){
    nameError.classList.remove('show');
    countError.classList.remove('show');
  }

  addBtn.addEventListener('click', function(){
    clearErrors();
    const name = nameInput.value.trim();
    const countVal = parseInt(countInput.value, 10);
    let ok = true;
    if (!name){
      nameError.classList.add('show');
      ok = false;
    }
    if (!countVal || countVal < 1){
      countError.classList.add('show');
      ok = false;
    }
    if (!ok) return;

    const beforeTotal = totalCount();
    const entry = { id: Date.now() + '-' + Math.random().toString(36).slice(2,7), name: name, count: countVal, ts: Date.now() };
    entries.push(entry);
    save();
    render(true);

    const afterTotal = beforeTotal + countVal;
    if (Math.floor(afterTotal/10) > Math.floor(beforeTotal/10)){
      vibrate([40,60,40,60,80]);
    } else {
      vibrate(25);
    }

    nameInput.value = '';
    countInput.value = '1';
    nameInput.focus();
  });

  undoBtn.addEventListener('click', function(){
    if (entries.length > 0){
      entries.pop();
      save();
      render(true);
    }
  });

  resetBtn.addEventListener('click', function(){
    if (entries.length === 0) return;
    if (confirm('Reset the count and clear all logged mistakes?')){
      entries = [];
      save();
      render(true);
    }
  });

  render(false);

  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
